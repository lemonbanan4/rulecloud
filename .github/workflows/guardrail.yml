name: Guardrail Hook Parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install RuleCloud CLI
        run: |
          cd cli
          npm ci
          npm run build
          npm install -g .

      - name: Verify hook parity
        run: rulecloud sync-hooks --check